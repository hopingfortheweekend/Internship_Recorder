<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>实习记录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>实习记录</h1>
    <button id="btn-new" class="btn btn-primary" type="button">+ 新增</button>
  </header>

  <nav class="tabs">
    <button id="tab-list" class="tab active" type="button">列表</button>
    <button id="tab-calendar" class="tab" type="button">日历</button>
  </nav>

  <main>
    <!-- 列表视图 -->
    <section id="list-view">
      <div class="search-row">
        <input type="search" id="search-input" placeholder="搜索标题或内容…">
        <select id="project-filter">
          <option value="">全部项目</option>
        </select>
      </div>
      <h2 class="view-title">最近记录</h2>
      <p id="list-empty" class="empty-hint" hidden>还没有记录，点右上角「+ 新增」开始吧。</p>
      <p id="list-no-result" class="empty-hint" hidden>没有匹配的记录。</p>
      <ul id="entry-list" class="entry-list"></ul>

      <div class="data-footer">
        <p class="data-note" id="backup-status"></p>
        <div class="data-actions">
          <button id="btn-export" class="btn" type="button">导出备份</button>
          <button id="btn-import" class="btn" type="button">导入数据</button>
        </div>
        <p class="data-note">备份文件可传到电脑（如微信「文件传输助手」），供整理脚本使用</p>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
    </section>

    <!-- 日历视图 -->
    <section id="calendar-view" hidden>
      <div class="cal-header">
        <button id="cal-prev" class="btn btn-icon" type="button" aria-label="上个月">‹</button>
        <h2 class="cal-title" id="cal-title"></h2>
        <button id="cal-next" class="btn btn-icon" type="button" aria-label="下个月">›</button>
        <button id="cal-today" class="btn" type="button">今天</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div id="day-panel">
        <h3 class="view-title" id="day-title"></h3>
        <ul id="day-entries" class="entry-list"></ul>
        <div id="day-empty" class="empty-hint" hidden>
          这一天没有记录。<br>
          <button id="btn-backfill" class="btn" type="button">补记一笔</button>
        </div>
      </div>
    </section>

    <!-- 详情视图 -->
    <section id="detail-view" hidden>
      <div id="detail-content"></div>
      <div class="detail-actions">
        <button id="btn-back" class="btn" type="button">返回</button>
        <button id="btn-edit" class="btn" type="button">编辑</button>
        <button id="btn-delete" class="btn btn-danger" type="button">删除</button>
      </div>
    </section>

    <!-- 录入表单 -->
    <section id="form-view" hidden>
      <h2 id="form-title" class="view-title">新增记录</h2>
      <form id="entry-form">
        <div class="field-row">
          <div class="field">
            <label for="f-date">日期</label>
            <input type="date" id="f-date" required>
          </div>
          <div class="field">
            <label for="f-project">项目</label>
            <input type="text" id="f-project" list="project-list" placeholder="如：官网重构（可留空）">
            <datalist id="project-list"></datalist>
          </div>
        </div>

        <div class="field">
          <label for="f-summary">1. 一句话概括这件事 <span class="req">*</span></label>
          <textarea id="f-summary" rows="2" required placeholder="一句话概括这件事"></textarea>
        </div>
        <div class="field">
          <label for="f-context">2. 这件事在项目里是哪一环，解决了什么问题？</label>
          <textarea id="f-context" rows="3" placeholder="可留空"></textarea>
        </div>
        <div class="field">
          <label for="f-blocker">3. 实践时的卡点是什么？又对此给出了什么样的思路或解决方案？</label>
          <textarea id="f-blocker" rows="3" placeholder="可留空"></textarea>
        </div>
        <div class="field">
          <label for="f-outcome">4. 最后交付了什么，或者说带来了哪些变化？</label>
          <textarea id="f-outcome" rows="3" placeholder="可留空"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/views.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
